name: Test, Build, Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: pdftoppm für die Tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Tests
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            luna1506/naklearn:latest
            luna1506/naklearn:${{ github.sha }}

      - name: Rauchtest
        run: scripts/smoke-image.sh luna1506/naklearn:${{ github.sha }}

      - name: Push
        run: |
          docker push luna1506/naklearn:${{ github.sha }}
          docker push luna1506/naklearn:latest

      - name: Deploy auf torte
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd ~/naklearn
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
